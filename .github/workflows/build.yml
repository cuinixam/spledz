name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.variant }} for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    # Zephyr's variables are not set here: the pipeline owns them. The build step
    # passes the toolchain ones per build, and the rest arrive through
    # build/install/env_setup.sh.
    strategy:
      fail-fast: false
      matrix:
        # The product line as a matrix. The variants are the prj_*.conf files and
        # nothing in the source tree enumerates them, so adding one means editing
        # a config and this list. The platforms are declared once more, in the
        # ZephyrBuild step of pypeline.yaml, which is where a platform is defined;
        # this list only says which of them CI builds.
        variant:
          - "disco"
          - "sleep"
          - "spa"
        platform:
          - "sim"
          - "esp32h2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install pypeline runner
        run: pip install pypeline-runner
        shell: bash

      # One command: tools, west workspace, blobs, and the build itself. The
      # pair is the whole interface, so CI runs what a developer runs.
      - name: Build
        run: pypeline run -i platform=${{ matrix.platform }} -i variant=${{ matrix.variant }}
        shell: bash

      - name: Smoke test
        # Only the simulator produces something this runner can execute. The
        # application never returns, so being alive after 2s (exit 124) is the
        # pass condition.
        if: matrix.platform == 'sim'
        run: |
          timeout 2 ./build/sim/${{ matrix.variant }}/zephyr/zephyr.exe || [ $? -eq 124 ]
        shell: bash

      - name: Check the flashable image
        # Nothing here can run a cross build, so the check is that the image the
        # board would be flashed with exists and is not empty.
        if: matrix.platform != 'sim'
        run: |
          test -s build/${{ matrix.platform }}/${{ matrix.variant }}/zephyr/zephyr.bin
        shell: bash
