name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  build-linux:
    name: Build ${{ matrix.variant }} (Linux)
    runs-on: ubuntu-latest
    # Zephyr's variables are not set here: the ZephyrSetup pipeline step owns them
    # and the build step gets them from build/install/env_setup.sh.
    strategy:
      fail-fast: false
      matrix:
        # This list is the variant model. Nothing in the source tree carries it:
        # Zephyr only ever sees the FILE_SUFFIX passed on the command line, so
        # adding a variant means editing a prj_*.conf and this matrix.
        variant:
          - "disco"
          - "sleep"
          - "spa"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install pypeline runner
        run: pip install pypeline-runner
        shell: bash

      - name: Install tools and create the west workspace
        run: pypeline run
        shell: bash

      - name: Build ${{ matrix.variant }}
        run: |
          source .venv/bin/activate
          source build/install/env_setup.sh
          west build -b native_sim/native/64 -d build/${{ matrix.variant }} app \
            -- -DFILE_SUFFIX=${{ matrix.variant }}
        shell: bash

      - name: Smoke test ${{ matrix.variant }}
        # The application never returns, so being alive after 2s (exit 124) is
        # the pass condition.
        run: |
          timeout 2 ./build/${{ matrix.variant }}/zephyr/zephyr.exe || [ $? -eq 124 ]
        shell: bash
