manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: cuinixam
      url-base: https://github.com/cuinixam

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.0
      # Not `zephyr/`: this repository is the workspace root and is therefore a
      # west project itself, and Zephyr registers any project holding
      # `zephyr/CMakeLists.txt` + `zephyr/Kconfig` as a module. A checkout at the
      # root would make this repo look like a module wrapping Zephyr, and Kconfig
      # would recurse into `Kconfig.zephyr`.
      path: deps/zephyr
      # Without this, `west build` does not exist: west learns Zephyr's extension
      # commands from this file. The official manifests get it through `import`,
      # which also pulls every module. The import below is name-filtered instead,
      # so only the modules a board here actually needs come along.
      west-commands: scripts/west-commands.yml
      # native_sim needs no vendor HAL; the ESP32-H2 board needs Espressif's, and
      # it is declared in Zephyr's own manifest. It keeps the path upstream gives
      # it, `modules/hal/espressif`, so this workspace looks like every other
      # Zephyr one. Do not add `path-prefix` here to move it under `deps/`: west
      # applies an import's prefix to the importing project as well, which would
      # silently relocate the Zephyr checkout above.
      import:
        name-allowlist:
          - hal_espressif

    - name: SPLed
      remote: cuinixam
      path: deps/spled
      revision: e2f5dfd07187d340f586ed96f18b45225ff832e2

  # `.` makes this repository the workspace root, so `west update` clones zephyr
  # and spled into it instead of beside it. `west init -l` cannot produce this
  # layout, because it always puts `.west` next to the manifest repo. The
  # workspace is configured directly instead (see README).
  self:
    path: .
