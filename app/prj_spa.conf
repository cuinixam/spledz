# Spa: brightness pulsates and the light cycles through two colors.
# Feature values taken from SPLed's variants/Spa/config.txt.
CONFIG_GPIO=y
CONFIG_LOG=y
# The shell replaces pc_terminal's keyboard: `spled power`, `spled up/down`.
CONFIG_SHELL=y
# Keep the shell in the terminal that started the binary. The LED display uses
# the second UART, which stays on its own pseudo terminal.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_OS_TASK_PERIOD=10
CONFIG_BRIGHTNESS_ADJUSTMENT_AUTOMATIC=y
CONFIG_BRIGHTNESS_ADJUSTMENT_PERIOD=10
CONFIG_COLOR_PURPLE=y
CONFIG_COLOR_1_GREEN=y
