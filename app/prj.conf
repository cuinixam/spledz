# Default build (no FILE_SUFFIX given). Same product as Disco.
#
# FILE_SUFFIX replaces this file rather than extending it, so every prj_*.conf
# repeats the Zephyr settings below. SPLed has no such duplication: its variants
# only list what differs.
CONFIG_GPIO=y
CONFIG_LOG=y
# The shell replaces pc_terminal's keyboard: `spled power`, `spled up/down`.
CONFIG_SHELL=y
# Keep the shell in the terminal that started the binary. The LED display uses
# the second UART, which stays on its own pseudo terminal.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_OS_TASK_PERIOD=10
CONFIG_BLINKING=y
CONFIG_COLOR_GREEN=y
CONFIG_COLOR_1_OFF=y
