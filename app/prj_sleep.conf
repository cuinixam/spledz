# Sleep: constant color, brightness adjusted by hand.
# Feature values taken from SPLed's variants/Sleep/config.txt.
CONFIG_GPIO=y
CONFIG_LOG=y
# The shell replaces pc_terminal's keyboard: `spled power`, `spled up/down`.
CONFIG_SHELL=y
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_OS_TASK_PERIOD=10
CONFIG_BRIGHTNESS_ADJUSTMENT_MANUAL=y
CONFIG_COLOR_PURPLE=y
CONFIG_COLOR_1_OFF=y
